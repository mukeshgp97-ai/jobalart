resolver 1.1.1.1 8.8.8.8 ipv6=off valid=300s;

server {
    listen 8080;
    server_name _;

    location = /ads.txt {
        default_type text/plain;
        add_header Cache-Control "public, max-age=3600";
        return 200 "google.com, pub-7636253814525920, DIRECT, f08c47fec0942fa0\n";
    }

    location / {
        set $job_upstream "jobalart-news.higgsfield.app";

        proxy_ssl_server_name on;
        proxy_ssl_name jobalart-news.higgsfield.app;
        proxy_set_header Host jobalart-news.higgsfield.app;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_pass https://$job_upstream;
        proxy_redirect https://jobalart-news.higgsfield.app/ /;
    }
}
